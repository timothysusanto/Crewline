<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Your availability</title>
<!--
  Rung 3 of the capture ladder (docs/agencymodelshape.md step 3): a 7 × 3 chip
  grid, twenty seconds, no login. Opened from a signed one-tap link in the chat.

  Design constraints this page is built to, in order:
    - It is used one-handed, on a phone, often standing up. Chips are thumb-sized
      and there is no keyboard input anywhere.
    - It must work on an old Android in a basement with one bar of signal, so:
      no framework, no fonts, no images, one round trip to load and one to save.
    - The reader may not have great eyesight or great English. Big type, plain
      words, no jargon.
-->
<style>
  :root {
    --bg: #16181C; --panel: #22252B; --seam: #33373F;
    --text: #ECEEF1; --dim: #9BA3AF;
    --on: #2E6F4E; --on-edge: #47A473; --on-text: #E7F6EC;
    --accent: #E0A33E;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F6F7F9; --panel: #FFFFFF; --seam: #DDE1E6;
      --text: #1A1D21; --dim: #616A75;
      --on: #D6EFE0; --on-edge: #2E6F4E; --on-text: #14432B;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 140px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .week { color: var(--dim); font-size: 15px; margin: 0 0 20px; }
  .hint { color: var(--dim); font-size: 14px; margin: 0 0 18px; }

  .day {
    background: var(--panel); border: 1px solid var(--seam); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .day-name { font-weight: 600; font-size: 15px; margin-bottom: 10px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip {
    /* 48px is the smallest reliable thumb target; these are taller. */
    min-height: 54px; border-radius: 10px; cursor: pointer;
    background: transparent; border: 1.5px solid var(--seam); color: var(--dim);
    font: inherit; font-size: 14px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip .hours { font-size: 11px; font-weight: 400; opacity: .8; }
  .chip[aria-pressed="true"] {
    background: var(--on); border-color: var(--on-edge); color: var(--on-text);
  }
  .chip:active { transform: scale(.97); }

  .day-all {
    background: none; border: none; color: var(--accent); font: inherit;
    font-size: 13px; font-weight: 600; padding: 0; cursor: pointer; float: right;
  }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--seam);
  }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .count { flex: 1; font-size: 14px; color: var(--dim); }
  button.save, button.none {
    min-height: 50px; padding: 0 20px; border-radius: 10px; border: none;
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button.save { background: var(--on-edge); color: #fff; }
  button.none { background: transparent; color: var(--dim); border: 1.5px solid var(--seam); font-weight: 600; }
  button[disabled] { opacity: .5; cursor: default; }

  .msg { padding: 14px; border-radius: 10px; margin-bottom: 18px; font-size: 15px; }
  .msg.err { background: #4A2224; color: #FFD9DB; }
  .msg.ok { background: var(--on); color: var(--on-text); }
  @media (prefers-color-scheme: light) { .msg.err { background: #FDE7E9; color: #7A1E24; } }
  .done { text-align: center; padding: 40px 0; }
  .done .tick { font-size: 46px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <p class="hint" id="loading">Loading your week…</p>
</div>

<div class="bar" id="bar" style="display:none;">
  <div class="bar-inner">
    <span class="count" id="count"></span>
    <button class="none" onclick="submitNone()">Can't work</button>
    <button class="save" id="saveBtn" onclick="save()">Save</button>
  </div>
</div>

<script>
  // The token is the credential — see signedLinks.js. It never leaves this URL.
  const token = location.pathname.split("/").filter(Boolean).pop();
  let model = null;
  /** dateIso -> Set of blocks. */
  const selected = new Map();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function load() {
    try {
      const res = await fetch(`/api/availability/${encodeURIComponent(token)}`);
      const body = await res.json();
      if (!res.ok) return fail(body.error || "Something went wrong.");
      model = body;
      for (const day of model.dates) selected.set(day.dateIso, new Set(day.selected));
      render();
    } catch {
      fail("Can't reach us right now — check your signal and try again.");
    }
  }

  function fail(message) {
    document.getElementById("wrap").innerHTML = `<div class="msg err">${esc(message)}</div>`;
    document.getElementById("bar").style.display = "none";
  }

  function render() {
    const heading = model.submittedAt
      ? "Update your availability"
      : `Hi ${esc(model.name)} — when can you work?`;
    document.getElementById("wrap").innerHTML = `
      <h1>${heading}</h1>
      <p class="week">Week of ${esc(model.weekLabel)}</p>
      <p class="hint">Tap the shifts you can work. Anything you leave off counts as a no, so only tap what you can actually do.</p>
      ${model.dates.map((day) => `
        <div class="day">
          <div class="day-name">${esc(day.label)}
            <button class="day-all" onclick="toggleDay('${day.dateIso}')">all day</button>
          </div>
          <div class="chips">
            ${model.blocks.map((b) => `
              <button class="chip" aria-pressed="false" id="c-${day.dateIso}-${b.key}"
                      onclick="toggle('${day.dateIso}','${b.key}')">
                <span>${esc(b.label)}</span>
                <span class="hours">${esc(hoursFor(b.key))}</span>
              </button>`).join("")}
          </div>
        </div>`).join("")}
    `;
    document.getElementById("bar").style.display = "";
    paint();
  }

  function hoursFor(block) {
    return { AM: "6am–2pm", PM: "2pm–10pm", NIGHT: "10pm–6am" }[block] || "";
  }

  function toggle(dateIso, block) {
    const set = selected.get(dateIso);
    if (set.has(block)) set.delete(block); else set.add(block);
    paint();
  }

  /** All three on, or all three off if they're already all on. */
  function toggleDay(dateIso) {
    const set = selected.get(dateIso);
    const all = model.blocks.map((b) => b.key);
    if (all.every((b) => set.has(b))) set.clear();
    else for (const b of all) set.add(b);
    paint();
  }

  function paint() {
    let total = 0;
    for (const day of model.dates) {
      const set = selected.get(day.dateIso);
      total += set.size;
      for (const b of model.blocks) {
        const el = document.getElementById(`c-${day.dateIso}-${b.key}`);
        if (el) el.setAttribute("aria-pressed", set.has(b.key) ? "true" : "false");
      }
    }
    document.getElementById("count").textContent =
      total === 0 ? "Nothing selected yet" : `${total} shift${total === 1 ? "" : "s"} selected`;
  }

  function collect() {
    const days = {};
    for (const [dateIso, set] of selected) {
      if (set.size) days[dateIso] = [...set];
    }
    return days;
  }

  async function save() { await send(collect(), false); }

  /**
   * "Can't work" is a real answer, not an empty form — the three-state model
   * needs it to be distinguishable from never replying.
   */
  async function submitNone() {
    if (!confirm("Mark yourself as not available for this whole week?")) return;
    await send({}, true);
  }

  async function send(days, none) {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      const res = await fetch(`/api/availability/${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Couldn't save.");
      done(body.cells, none);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Save";
      alert(err.message || "Couldn't save — check your signal and try again.");
    }
  }

  function done(cells, none) {
    document.getElementById("bar").style.display = "none";
    document.getElementById("wrap").innerHTML = `
      <div class="done">
        <div class="tick">✓</div>
        <h1>${none ? "Noted" : "Locked in"}</h1>
        <p class="week">${none
          ? "You're down as not available for this week."
          : `${cells} shift${cells === 1 ? "" : "s"} for the week of ${esc(model.weekLabel)}.`}</p>
        <p class="hint">${none
          ? "Message us any time if that changes."
          : "You'll get offers as they come. You can close this page."}</p>
      </div>`;
  }

  load();
</script>
</body>
</html>
