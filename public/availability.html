<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F4EC">
<title>Your availability — Crewline</title>
<link rel="stylesheet" href="/static/crewline.css">
<style>
  body { padding-bottom: calc(96px + var(--sab)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 22px) 16px 0; position: relative; z-index: 1; }
  h1 { font-size: 26px; line-height: 1.15; }
  .week { font-family: var(--font-docket); font-size: 13px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; }
  .hint { margin: 10px 0 18px; font-size: 15px; color: var(--ink-2); }
  .day { background: var(--docket); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .day-name { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 15px; margin-bottom: 8px; }
  .day-all { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--steel); min-height: 34px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip { min-height: 56px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 15px; -webkit-tap-highlight-color: transparent; }
  .chip .hours { font-size: 11px; font-weight: 600; color: var(--ink-2); font-family: var(--font-docket); }
  .chip[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #fff; }
  .chip[aria-pressed="true"] .hours { color: rgba(255,255,255,.85); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + var(--sab)); z-index: 30; }
  .bar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .count { font-family: var(--font-docket); font-size: 13px; color: var(--ink-2); flex: 1; }
  .bar button { min-height: 48px; border-radius: 12px; padding: 0 18px; font-weight: 800; font-size: 15px; border: 1px solid var(--line); background: var(--paper); }
  .bar .save { background: var(--ember); border-color: var(--ember); color: #fff; min-width: 130px; }
  .bar .none { color: var(--ink-2); }
  .msg.err { background: var(--red-bg); color: var(--red); padding: 14px; border-radius: 12px; font-weight: 700; }
  .done { text-align: center; padding: 40px 0; }
  .done .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 36px; margin: 0 auto 16px; }
</style>
</head>
<body class="no-tabbar">
<div class="lamp"></div>
<div class="wrap" id="wrap">
  <p class="hint" id="loading">Loading your week…</p>
</div>

<div class="bar" id="bar" style="display:none;">
  <div class="bar-inner">
    <span class="count" id="count"></span>
    <button class="none" onclick="submitNone()">Can't work</button>
    <button class="save" id="saveBtn" onclick="save()">Lock it in</button>
  </div>
</div>

<script>
  // The token is the credential — see signedLinks.js. It never leaves this URL.
  const token = location.pathname.split("/").filter(Boolean).pop();
  let model = null;
  /** dateIso -> Set of blocks. */
  const selected = new Map();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function load() {
    try {
      const res = await fetch(`/api/availability/${encodeURIComponent(token)}`);
      const body = await res.json();
      if (!res.ok) return fail(body.error || "Something went wrong.");
      model = body;
      for (const day of model.dates) selected.set(day.dateIso, new Set(day.selected));
      render();
    } catch {
      fail("Can't reach us right now — check your signal and try again.");
    }
  }

  function fail(message) {
    document.getElementById("wrap").innerHTML = `<div class="msg err">${esc(message)}</div>`;
    document.getElementById("bar").style.display = "none";
  }

  function render() {
    const heading = model.submittedAt
      ? "Update your availability"
      : `Hi ${esc(model.name)} — when can you work?`;
    document.getElementById("wrap").innerHTML = `
      <h1>${heading}</h1>
      <p class="week">Week of ${esc(model.weekLabel)}</p>
      <p class="hint">Tap the shifts you can work. Anything you leave off counts as a no, so only tap what you can really do.</p>
      ${model.dates.map((day) => `
        <div class="day">
          <div class="day-name">${esc(day.label)}
            <button class="day-all" onclick="toggleDay('${day.dateIso}')">all day</button>
          </div>
          <div class="chips">
            ${model.blocks.map((b) => `
              <button class="chip" aria-pressed="false" id="c-${day.dateIso}-${b.key}"
                      onclick="toggle('${day.dateIso}','${b.key}')">
                <span>${esc(b.label)}</span>
                <span class="hours">${esc(hoursFor(b.key))}</span>
              </button>`).join("")}
          </div>
        </div>`).join("")}
    `;
    document.getElementById("bar").style.display = "";
    paint();
  }

  function hoursFor(block) {
    return { AM: "6am–2pm", PM: "2pm–10pm", NIGHT: "10pm–6am" }[block] || "";
  }

  function toggle(dateIso, block) {
    const set = selected.get(dateIso);
    if (set.has(block)) set.delete(block); else set.add(block);
    paint();
  }

  /** All three on, or all three off if they're already all on. */
  function toggleDay(dateIso) {
    const set = selected.get(dateIso);
    const all = model.blocks.map((b) => b.key);
    if (all.every((b) => set.has(b))) set.clear();
    else for (const b of all) set.add(b);
    paint();
  }

  function paint() {
    let total = 0;
    for (const day of model.dates) {
      const set = selected.get(day.dateIso);
      total += set.size;
      for (const b of model.blocks) {
        const el = document.getElementById(`c-${day.dateIso}-${b.key}`);
        if (el) el.setAttribute("aria-pressed", set.has(b.key) ? "true" : "false");
      }
    }
    document.getElementById("count").textContent =
      total === 0 ? "Nothing selected yet" : `${total} shift${total === 1 ? "" : "s"} selected`;
  }

  function collect() {
    const days = {};
    for (const [dateIso, set] of selected) {
      if (set.size) days[dateIso] = [...set];
    }
    return days;
  }

  async function save() { await send(collect(), false); }

  /**
   * "Can't work" is a real answer, not an empty form — the three-state model
   * needs it to be distinguishable from never replying.
   */
  async function submitNone() {
    if (!confirm("Mark yourself as not available for this whole week?")) return;
    await send({}, true);
  }

  async function send(days, none) {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    try {
      const res = await fetch(`/api/availability/${encodeURIComponent(token)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Couldn't save.");
      done(body.cells, none);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Lock it in";
      alert(err.message || "Couldn't save — check your signal and try again.");
    }
  }

  function done(cells, none) {
    document.getElementById("bar").style.display = "none";
    document.getElementById("wrap").innerHTML = `
      <div class="done">
        <div class="tick">✓</div>
        <h1>${none ? "Noted" : "Locked in"}</h1>
        <p class="week">${none
          ? "You're down as not available for this week."
          : `${cells} shift${cells === 1 ? "" : "s"} for the week of ${esc(model.weekLabel)}.`}</p>
        <p class="hint">${none
          ? "Message us any time if that changes."
          : "Your manager builds the roster from this. You can close this page."}</p>
      </div>`;
  }

  load();
</script>
</body>
</html>
