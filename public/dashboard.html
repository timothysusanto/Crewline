<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crewline">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">
<title>Today — Crewline</title>
<link rel="stylesheet" href="/static/crewline.css">
<style>
  .paymini { display: flex; align-items: center; gap: 12px; }
  .paymini .big { font-family: var(--font-docket); font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .paymini .big small { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .rost .st { font-family: var(--font-docket); font-size: 12px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; background: var(--docket); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 13px; }
  .quick a svg { width: 24px; height: 24px; stroke: var(--ember); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="lamp"></div>
<div class="app cl-app">
  <div class="topbar">
    <div class="kicker"><span class="live" id="liveDot"></span><span id="venueName">—</span><span>·</span><span id="dateLine"></span></div>
    <h1>Today</h1>
    <div class="actions">
      <span class="pill ok" id="onPill">0 on</span>
      <span class="pill warn" id="flagPill" style="display:none">0 to review</span>
      <span class="grow"></span>
      <span class="mono muted" id="clock" style="font-size:13px"></span>
    </div>
  </div>

  <div class="section" id="setupSection" style="display:none"></div>

  <div class="section">
    <h2>On shift now</h2>
    <div id="onShift"><div class="empty">Loading…</div></div>
  </div>

  <div class="section" id="reviewSection" style="display:none">
    <h2>Needs a look</h2>
    <div id="review"></div>
  </div>

  <div class="section">
    <h2>Payroll this week <span class="spacer"></span><a href="#" id="payLink">Open Pay ›</a></h2>
    <a class="card" id="payCard" href="#" style="display:block;text-decoration:none;color:inherit"><div class="empty">Loading…</div></a>
  </div>

  <div class="section" id="rosterSection" style="display:none">
    <h2>Rostered today <span class="spacer"></span><a href="#" id="rosterLink">Roster ›</a></h2>
    <div class="card rows" id="rosterToday"></div>
  </div>

  <div class="section">
    <h2>Quick</h2>
    <div class="quick">
      <a href="#" id="qCrew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>Crew</a>
      <a href="#" id="qSites"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sites</a>
      <a href="#" id="qHist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</a>
    </div>
  </div>
</div>

<script src="/static/crewline.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const E = CL.esc;
let data = null;

function staffOf(phone) { return (data.staff || []).find((s) => s.phone === phone); }
function nameOf(phone) { const s = staffOf(phone); return s ? s.name : phone; }
function deptOf(phone) { const s = staffOf(phone); return s ? (s.department ? cap(s.department) : (s.role || "")) : ""; }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ""; }
function effective(s) {
  const inIso = (s.amended && s.amended.clockInTime) || s.clockIn.time;
  const outIso = (s.amended && s.amended.clockOutTime) || (s.clockOut && s.clockOut.time);
  return { inIso, outIso };
}
function onBreak(s) { const b = (s.breaks || [])[s.breaks ? s.breaks.length - 1 : -1]; return b && !b.end; }

async function load() {
  try { data = await CL.api("/api/dashboard"); } catch (e) { if (e.status !== 401) $("onShift").innerHTML = `<div class="err">${E(e.message)}</div>`; return; }
  render();
  loadPay(); loadRosterToday(); loadSetup();
}

/* First-run checklist: shown until the venue has crew with pay details, a site, a forecast and a published roster. */
async function loadSetup() {
  try {
    const [sites, pay] = await Promise.all([CL.api("/api/sites").catch(() => ({ sites: [] })), CL.api("/api/pay/week").catch(() => null)]);
    const crew = (data.staff || []).filter((s) => s.role !== "owner" && s.active !== false);
    const steps = [
      { done: crew.length > 0, t: "Add your crew", s: crew.length ? `${crew.length} added` : "Name, mobile, department, pay", href: CL.url("/more") + "#crew" },
      { done: crew.length > 0 && !(pay && pay.flags.some((f) => f.code === "setup")), t: "Set pay details", s: "Casual / part-time / full-time / salaried, level, rate", href: CL.url("/more") + "#crew" },
      { done: (sites.sites || []).some((x) => x.active !== false && x.geofence), t: "Set your site", s: "Location and clock-in radius", href: CL.url("/more") + "#sites" },
      { done: Boolean(pay && pay.totals.expectedRevenue > 0), t: "Enter this week's revenue forecast", s: "Turns payroll into a % you can manage", href: CL.url("/pay") },
      { done: crew.some((s) => s.telegramChatId), t: "Crew say hi to the bot", s: "Each person shares their number in Telegram", href: null },
    ];
    const left = steps.filter((x) => !x.done).length;
    const el = $("setupSection");
    if (!left) { el.style.display = "none"; return; }
    el.style.display = "";
    el.innerHTML = `<div class="setup"><h3>Set up Crewline — ${steps.length - left} of ${steps.length} done</h3><p>Ten minutes, once. Then the week runs itself.</p>
      ${steps.map((x, i) => `<${x.href ? `a href="${x.href}"` : "div"} class="step ${x.done ? "done" : ""}"><span class="n">${x.done ? "✓" : i + 1}</span><span class="grow"><div class="t">${x.t}</div><div class="s">${x.s}</div></span></${x.href ? "a" : "div"}>`).join("")}</div>`;
  } catch { $("setupSection").style.display = "none"; }
}

function render() {
  const { shifts } = data;
  const on = shifts.filter((s) => !s.clockOut && !s.clockIn.flaggedForReview).sort((a, b) => new Date(a.clockIn.time) - new Date(b.clockIn.time));
  const flagged = shifts.filter((s) => !s.clockOut && s.clockIn.flaggedForReview);
  $("onPill").textContent = `${on.length} on`;
  $("flagPill").style.display = flagged.length ? "" : "none";
  $("flagPill").textContent = `${flagged.length} to review`;
  $("dateLine").textContent = new Date().toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });

  $("onShift").innerHTML = on.length ? `<div class="tickets">${on.map((s) => {
    const brk = onBreak(s);
    return `<div class="ticket"><span class="clip"></span>
      <div class="name ellipsis">${E(nameOf(s.staffPhone))}</div>
      <div class="meta ellipsis">${E(deptOf(s.staffPhone))}${s.siteName ? " · " + E(s.siteName) : ""}</div>
      <div class="big">${CL.dur(Date.now() - new Date(s.clockIn.time))}</div>
      <div class="since">${brk ? '<span class="pill brk">on break</span>' : "on since " + CL.clock(s.clockIn.time)}</div>
      <button class="btn sm" data-close="${E(s.shiftId)}" type="button">Clock out now</button>
    </div>`; }).join("")}</div>`
    : `<div class="card"><div class="empty">Nobody's on. Tickets land here the moment someone messages <b>in</b>.</div></div>`;
  $("onShift").querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => forceClose(b.dataset.close, b)));

  $("reviewSection").style.display = flagged.length ? "" : "none";
  $("review").innerHTML = `<div class="tickets">${flagged.map((s) => `<div class="ticket flagged"><span class="clip"></span>
      <div class="name ellipsis">${E(nameOf(s.staffPhone))}</div>
      <div class="meta">📍 ${E(s.clockIn.distanceMeters)}m from ${E(s.siteName || "the venue")}</div>
      <div class="since" style="margin-top:8px">tried at ${CL.clock(s.clockIn.time)}</div>
      <div class="btn-row" style="margin-top:10px"><button class="btn sm ok" data-ok="${E(s.shiftId)}" type="button">Approve</button><button class="btn sm danger" data-cut="${E(s.shiftId)}" type="button">Cut</button></div>
    </div>`).join("")}</div>`;
  $("review").querySelectorAll("[data-ok]").forEach((b) => (b.onclick = () => review(b.dataset.ok, true, b)));
  $("review").querySelectorAll("[data-cut]").forEach((b) => (b.onclick = () => review(b.dataset.cut, false, b)));
}

async function forceClose(id, btn) {
  if (!CL.confirm("Clock this person out now? Their shift closes at the current time.")) return;
  btn.disabled = true;
  try { await CL.api(`/api/shifts/${encodeURIComponent(id)}/close`, { method: "POST" }); CL.toast("Clocked out"); load(); }
  catch (e) { btn.disabled = false; CL.toast("Couldn't close that shift: " + e.message); }
}
async function review(id, approve, btn) {
  btn.closest(".ticket").querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { await CL.api(`/api/shifts/${encodeURIComponent(id)}/review`, { method: "POST", body: { approve } }); CL.toast(approve ? "Approved — they're on the board" : "Cut"); load(); }
  catch (e) { btn.closest(".ticket").querySelectorAll("button").forEach((b) => (b.disabled = false)); CL.toast("That didn't save — try again."); }
}

async function loadPay() {
  try {
    const w = await CL.api("/api/pay/week");
    const t = w.totals, hasRev = t.expectedRevenue > 0;
    const verdict = !hasRev ? `<span class="muted">Add a revenue forecast on the Pay page</span>`
      : t.status === "ok" ? `<span class="ok" style="font-weight:700">✓ ${CL.money(t.variance)} under budget</span>`
      : `<span style="font-weight:700;color:var(--${t.status === "warn" ? "amber" : "red"})">${t.status === "warn" ? "!" : "✕"} ${CL.money(-t.variance)} over budget</span>`;
    const sm = Math.max(w.settings.targets.totalPct * 1.35, (t.pct || 0) * 1.05, 10);
    $("payCard").innerHTML = `<div class="paymini">
        <div class="grow"><div class="big">${CL.money(t.projected)} <small>${hasRev ? "of " + CL.money(t.budget) + " budget" : "payroll"}</small></div>
          <div style="margin-top:6px;font-size:14px">${verdict}</div></div>
        <div class="right mono" style="font-weight:800;font-size:22px">${hasRev ? CL.pct(t.pct) : ""}</div></div>
      <div class="gauge ${t.status}"><div class="fill" style="width:${hasRev ? Math.min(100, (t.pct / sm) * 100) : 0}%"></div>${hasRev ? `<div class="tick" style="left:${(w.settings.targets.totalPct / sm) * 100}%"></div>` : ""}</div>
      <div class="hint" style="margin-top:4px">${CL.range(w.weekStart, w.weekEnd)} · kitchen ${CL.pct(w.departments.kitchen.pct)} · service ${CL.pct(w.departments.service.pct)}${w.flags.some((f) => f.level === "over") ? ' · <span style="color:var(--red);font-weight:700">overtime flagged</span>' : ""}</div>`;
  } catch (e) { $("payCard").innerHTML = `<div class="empty">${E(e.message)}</div>`; }
}

async function loadRosterToday() {
  const today = CL.today();
  try {
    const r = await CL.api(`/api/core/roster?weekStart=${CL.mondayOf(today)}`);
    const todays = (r.shifts || []).filter((s) => s.date === today).sort((a, b) => a.start.localeCompare(b.start));
    if (!todays.length) { $("rosterSection").style.display = "none"; return; }
    const live = data.shifts.filter((s) => !s.clockOut);
    $("rosterSection").style.display = "";
    $("rosterToday").innerHTML = todays.map((s) => {
      const nm = nameOf(s.workerId);
      const on = live.find((x) => x.staffPhone === s.workerId);
      const done = data.shifts.find((x) => x.staffPhone === s.workerId && x.clockOut && effective(x).inIso.slice(0, 10) === today);
      const nowM = new Date().getHours() * 60 + new Date().getMinutes();
      const [sh, sm] = s.start.split(":").map(Number);
      const startM = sh * 60 + sm;
      let pill = on ? `<span class="pill ok">on</span>` : done ? `<span class="pill">done</span>` : nowM > startM + 10 ? `<span class="pill warn">${Math.round((nowM - startM))}m late</span>` : `<span class="pill">${s.published ? "rostered" : "unpublished"}</span>`;
      return `<div class="row rost"><div class="avatar">${CL.initials(nm)}</div><div class="grow"><div class="t">${E(nm)}</div><div class="s">${s.start}–${s.end}${s.role ? " · " + E(s.role) : ""}</div></div>${pill}</div>`;
    }).join("");
  } catch { $("rosterSection").style.display = "none"; }
}

/* ---------- boot ---------- */
["payLink", "payCard"].forEach((id) => ($(id).href = CL.url("/pay")));
$("rosterLink").href = CL.url("/roster");
$("qCrew").href = CL.url("/more") + "#crew"; $("qSites").href = CL.url("/more") + "#sites"; $("qHist").href = CL.url("/more") + "#history";
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" }); }, 1000);
CL.tabbar("today"); CL.topbar();
CL.requireKey(() => {
  CL.venueName().then((me) => { if (me && me.name) $("venueName").textContent = me.name; });
  load();
  setInterval(() => { if (!document.hidden) load(); }, 120000);
});
</script>
</body>
</html>
